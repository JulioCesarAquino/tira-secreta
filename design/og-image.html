<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=block" rel="stylesheet">
<style>
  html,body{margin:0}
  .card{width:600px;height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
        background:radial-gradient(circle at 50% 35%,#fffaf0 0,#fdf1d8 55%,#f9e0ad 100%);font-family:'Baloo 2',sans-serif}
  .card img{width:280px;height:420px;margin:-30px 0 -38px;filter:drop-shadow(0 14px 18px rgba(15,86,110,.25))}
  .name{font-size:92px;font-weight:800;line-height:.9;letter-spacing:-1px}
  .t{color:#0f566e}.s{color:#f45b4b}
</style></head><body>
<div class="card" id="card"><img src="mark.svg"> <!-- gere o PNG com um screenshot de 600x600 do #card --><div class="name"><span class="t">Tira</span> <span class="s">Secreta</span></div></div>
</body></html>
