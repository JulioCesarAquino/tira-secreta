    </clipPath>
  </defs>
  <g transform="rotate(-14 100 150)">
    <!-- sola -->
    <path d="M100 12c40 0 58 36 55 72-3 26-14 40-13 66 1 34-12 62-42 62s-43-28-42-62c1-26-10-40-13-66-3-36 15-72 55-72z" fill="#14708f"/>
